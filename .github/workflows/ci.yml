# Shama's tests on every push: the Rust workspace – formatting, clippy, the tests – the TypeScript
# pipeline – its types and tests – the web build: the core as WASM, the self-test through it in
# Node and in Chromium, Firefox and – on macOS – WebKit; and the demo on an Android emulator, end
# to end. Actions are pinned by commit.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: sh engines/sherpa/fetch.sh linux
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck -w bindings/js -w bindings/react
      - run: npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: wasm-bindgen-cli at Cargo.lock's version
        run: cargo install wasm-bindgen-cli --locked --version "$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')"
      - run: npm ci
      - run: sh bindings/web/build.sh
      - run: npm run typecheck -w bindings/web
      - run: npm test -w bindings/web
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run e2e -w examples/web -- --project=chromium --project=firefox

  web-webkit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: wasm-bindgen-cli at Cargo.lock's version
        run: cargo install wasm-bindgen-cli --locked --version "$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')"
      - run: npm ci
      - run: sh bindings/web/build.sh
      - run: npx playwright install webkit
      - run: npm run e2e -w examples/web -- --project=webkit

  android:
    # The demo end to end on an Android emulator: the core built for Android, the app as a release
    # build, and the Maestro flows – the self-test with the embedded Turkish model, kept audio
    # played, saved and heard again, the microphone's diagnostics (the emulator's hears silence).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          targets: x86_64-linux-android
      # No cache of target/: sherpa-onnx-sys unpacks its libraries beside the builds, which a cache
      # restores without them – and its build script, seeing nothing changed, doesn't unpack them again.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .cache/device-models
          key: android-${{ hashFiles('package-lock.json', 'engines/sherpa/models.json') }}
      - run: cargo install cargo-ndk --locked --version 4.1.2
      - run: npm ci
      # Where a build fails, tools/ci-step.sh puts its errors in the annotations.
      - name: The core for Android
        run: |
          sh tools/ci-step.sh "The core for Android" \
            env ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_ABIS=x86_64 sh bindings/react-native/build.sh android
      - name: The demo as a release build
        run: |
          sh tools/ci-step.sh "The demo as a release build" sh -c '
            cd examples/react-native &&
            npm run fixtures &&
            npx expo prebuild -p android --no-install &&
            cd android && ./gradlew app:assembleRelease -PreactNativeArchitectures=x86_64'
          # The build's daemons would hold gigabytes the emulator needs.
          (cd examples/react-native/android && ./gradlew --stop)
          pkill -f KotlinCompileDaemon || true
      - name: Maestro, checked
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.0/maestro.zip
          echo "a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: sh tools/ci-android.sh emulator-5554
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro
          path: ~/.maestro/tests
          if-no-files-found: ignore
