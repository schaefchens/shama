[package]
name = "shama-wasm"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Shama's core for the web, through wasm-bindgen, run in a worker"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shama = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
# At the version of the wasm-bindgen CLI that bindings/web/build.sh runs.
wasm-bindgen = "=0.2.129"
