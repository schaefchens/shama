[workspace]
members = ["."]
resolver = "3"

[package]
name = "shama"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Voice commands and a voice assistant for apps: an app's own tools and phrases, recognized on the device, settled in stages"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
