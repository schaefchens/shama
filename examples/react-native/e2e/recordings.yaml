# Kept audio on a simulator or emulator, no microphone needed: a self-test recording heard as if
# spoken, its utterance played back, saved as a WAV and heard again from it.
appId: de.schaefchens.shama.example
---
- launchApp
# A first launch after installing may take a while to run its JavaScript.
- extendedWaitUntil:
    visible:
      id: tab-Listen
    timeout: 60000
- repeat:
    while:
      visible: "Open in .*"
    commands:
      - tapOn: Cancel
- tapOn:
    id: tab-Listen
- tapOn:
    id: recording-en-open
# Below the fold where the demo says that nothing here hears the language.
- scrollUntilVisible:
    element:
      id: result
      text: "open\\(book=moby, chapter=3\\) · deterministic"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "play-.*"
- tapOn:
    id: "play-.*"
- tapOn:
    id: "save-.*"
- scrollUntilVisible:
    element:
      id: "saved-.*"
      text: ".*shama-recordings/shama-.*\\.wav"
    timeout: 10000
- tapOn:
    id: "again-.*"
# Heard again: a second utterance, at the top of the list.
- scrollUntilVisible:
    element:
      id: utterance-2
    direction: UP
    timeout: 20000
- tapOn:
    id: tab-Log
- assertVisible:
    text: "(?s).*input: file \\(file\\).*"
