# The microphone with diagnostics on a simulator or emulator: hold to talk, then what Shama told
# of the microphone, the meter, and the log. Whatever the device's microphone hears will do. In
# Turkish: its embedded model is what the device test puts on every device.
appId: de.schaefchens.shama.example
---
- launchApp
# A first launch after installing may take a while to run its JavaScript.
- extendedWaitUntil:
    visible:
      id: tab-Listen
    timeout: 60000
- repeat:
    while:
      visible: "Open in .*"
    commands:
      - tapOn: Cancel
- tapOn:
    id: tab-Listen
- tapOn: "tr"
- longPressOn:
    id: talk
# The permissions, asked for at the first press: the microphone, and on iOS speech recognition.
- repeat:
    times: 2
    commands:
      - tapOn:
          text: "(Allow|OK|While using the app)"
          optional: true
- longPressOn:
    id: talk
- scrollUntilVisible:
    element:
      id: meter-graph
    timeout: 20000
- scrollUntilVisible:
    element:
      id: input-device
    timeout: 20000
- tapOn:
    id: tab-Log
- assertVisible:
    text: "(?s).*input: .*"
