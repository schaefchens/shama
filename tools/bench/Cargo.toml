[package]
name = "shama-bench"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Measures embedded speech recognizers for Shama over a corpus of WAVs"
publish = false

# A workspace of its own, with its own target dir: the measuring tool never builds into Shama's.
[workspace]

[dependencies]
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
